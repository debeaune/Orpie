version: '3.8'

services:
  app:
    build: .
    volumes:
      - .:/var/www/symfony
    depends_on:
      - database
    environment:
      DATABASE_URL: "mysql://orpie:orpie@database:3306/orpie"

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/symfony
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  database:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: orpie
      MYSQL_USER: orpie
      MYSQL_PASSWORD: orpie
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: